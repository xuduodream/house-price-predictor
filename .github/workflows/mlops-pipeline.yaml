name: MLOPs CI

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all steps'
        required: false
        default: 'false'
      run_data_processing:
        description: 'Run data processing'
        required: false
        default: 'false'
      run_model_training:
        description: 'Run model training'
        required: false
        default: 'false'
      build_docker_image:
        description: 'Build Docker image'
        required: false
        default: 'false'
  release:
    types: [created]
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  data_processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Processing (Cleaning Data) 
        run: |
          python src/data/run_processing.py   \
            --input data/raw/house_data.csv   \
            --output data/processed/cleaned_house_data.csv

      - name: Run Feature Engineering (Adding Features)
        run: |
          python src/features/engineer.py   \
            --input data/processed/cleaned_house_data.csv   \
            --output data/processed/featured_house_data.csv   \
            --preprocessor models/trained/preprocessor.pkl       

      - name: Upload Processed Data
        uses: actions/upload-artifact@v3
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv


      - name: Upload Preprocessor
        uses: actions/upload-artifact@v3
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl



  model_training:
    runs-on: ubuntu-latest
    needs: data_processing
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Processed Data
        uses: actions/download-artifact@v3
        with:
          name: processed-data
          path: data/processed/

      - name: Setup MLflow Tracking Server
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name mlflow-tracking ghcr.io/mlflow/mlflow:latest \
          mlflow server --host 0.0.0.0 \
          --backend-store-uri sqlite:///mlflow.db \
          --default-artifact-root /tmp/mlruns


      - name: Wait for MLflow Tracking Server to be ready
        run: |
          echo "Waiting for MLflow Tracking Server to be ready..."
          until curl -s http://localhost:5555/health | grep -q "OK"; do
            sleep 5
          done
          echo "MLflow Tracking Server is ready."


      - name: Train the Model
        run: |
          python src/models/train_model.py   \
            --config configs/model_config.yaml   \
            --data data/processed/featured_house_data.csv   \
            --models-dir models   \
            --mlflow-tracking-uri http://localhost:5555    


      - name: Upload Trained Model
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/trained/house_price_model.pkl

      - name: Cleanup up MLflow
        run: |
          docker stop mlflow-tracking 
          docker rm mlflow-tracking 
          docker rmi ghcr.io/mlflow/mlflow:latest



  build_and_publish:
    needs: model_training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Download Trained Model
        uses: actions/download-artifact@v3
        with:
          name: trained-model
          path: models/

      - name: Download Preprocessor
        uses: actions/download-artifact@v3
        with:
          name: preprocessor
          path: models/trained/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3    
      
      - name: Build and Test Docker Image
        run: |
          COMMIT_HASH=$(echo "${GITHUB_SHA}" | cut -c1-7)
          docker build -t ${vars.DOCKERHUB_USERNAME}/house-price-model:${COMMIT_HASH} -f Dockerfile .
          docker run -d -p 8000:8000 --name house-price-model ${vars.DOCKERHUB_USERNAME}/house-price-model:${COMMIT_HASH}
          for i in {1..10}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "FastAPI server is up and running."
              break
            else
              echo "Waiting for FastAPI server to start..."
              sleep 5
            fi
          done
          docker logs house-price-model

      - name: Clean up Test Docker Container
        run: |
          docker stop house-price-model
          docker rm house-price-model
     
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
     
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        run: |
          COMMIT_HASH=$(echo "${GITHUB_SHA}" | cut -c1-7)
          docker tag ${vars.DOCKERHUB_USERNAME}/house-price-model:${COMMIT_HASH} ${vars.DOCKERHUB_USERNAME}/house-price-model:latest
          docker push ${vars.DOCKERHUB_USERNAME}/house-price-model:${COMMIT_HASH}
          docker push ${vars.DOCKERHUB_USERNAME}/house-price-model:latest
       